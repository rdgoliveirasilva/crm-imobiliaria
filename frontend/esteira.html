<body class="corretor-page mobile-premium mobile-inner-page esteira-page"><header class="app-header">
        <div class="header-inner">
            <div class="header-brand">
                <div class="logo-mark">
                    <img class="desktop-brand" src="assets/img/logo2.png" alt="SR Lançamentos" onerror="this.style.display='none'; this.parentElement.classList.add('fallback');">
                    <img class="mobile-only" src="assets/img/logo.png" alt="Prospect"><i class="fas fa-building logo-fallback"></i>
                </div>
                <div class="header-brand-text">
                    <h1 class="desktop-brand">SR <span>Lançamentos</span></h1><strong class="mobile-only mobile-brand">Prospect</strong>
                    <p>Empreendimentos</p>
                </div>
            </div>
            <nav class="desktop-sidebar-nav" aria-label="Navegação principal desktop">
                <a href="corretor.html"><i class="fas fa-house"></i> Início</a>
                <a href="esteira.html" aria-current="page"><i class="fas fa-layer-group"></i><span>Esteira Comercial</span></a>
                <a href="vendas.html"><i class="fas fa-chart-simple"></i><span>Vendas</span></a>
                <a href="empreendimentos.html"><i class="far fa-building"></i> Empreendimentos</a>
                <a class="sidebar-account" href="conta.html"><i class="fas fa-gear"></i> Minha conta</a>
            </nav>
            <div class="header-user">
                <div class="user-info">
                    <span class="user-greeting">Bem vindo,</span>
                    <strong id="headerUserName">Corretor</strong>
                </div>
                <div class="mobile-only theme-control" id="themeControl">
                    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Escolher tema" aria-expanded="false" aria-controls="themeOptions"><i class="fas fa-circle-half-stroke" aria-hidden="true"></i></button>
                    <div id="themeOptions" class="theme-options" role="group" aria-label="Tema da interface" hidden>
                        <button type="button" data-theme-choice="auto" aria-pressed="true"><i class="fas fa-clock" aria-hidden="true"></i> Automático <small>Claro 6h–18h · escuro à noite</small></button>
                        <button type="button" data-theme-choice="light" aria-pressed="false"><i class="fas fa-sun" aria-hidden="true"></i> Claro</button>
                        <button type="button" data-theme-choice="dark" aria-pressed="false"><i class="fas fa-moon" aria-hidden="true"></i> Escuro</button>
                    </div>
                </div>
                <button class="btn-avatar" id="btnAvatar" title="Menu">
                    <i class="fas fa-user"></i>
                </button>
            </div>
        </div>
    </header><main class="app-main"><p class="pipeline-intro">Acompanhe seus clientes da documentação à conclusão da venda.</p>
<section class="pipeline-metrics" aria-label="Resumo da esteira" id="pipelineMetrics"></section>
<form class="pipeline-filters" id="pipelineFilters" role="search">
<label>Buscar cliente<input type="search" id="pipelineSearch" placeholder="Nome ou telefone"></label>
<label>Carteira<select id="pipelineWallet"><option value="">Todas as carteiras</option></select></label>
<label id="pipelineBrokerWrap" hidden>Corretor<select id="pipelineBroker"><option value="">Todos os corretores</option></select></label>
<label>Empreendimento<select id="pipelineProperty"><option value="">Todos os empreendimentos</option></select></label>
<label>Status<select id="pipelineStatus"><option value="">Todos os status</option><option value="ativo">Em andamento</option><option value="condicionado">Condicionado</option><option value="reprovado">Reprovado</option><option value="desistiu">Desistiu</option><option value="finalizado">Finalizado</option></select></label>
<label>Entrada na esteira · de<input type="date" id="pipelineFrom"></label><label>Até<input type="date" id="pipelineTo"></label><button type="submit">Atualizar</button>
</form>
<p id="pipelineFeedback" role="status" aria-live="polite"></p>
<div class="pipeline-board" id="pipelineBoard" aria-label="Kanban da esteira comercial"></div>
<dialog id="pipelineDialog" class="pipeline-dialog" aria-labelledby="pipelineTitle"></dialog></main><script src="js/api-client.js"></script><script src="js/avatar.js"></script><script src="js/esteira.js"></script><script src="js/desktop-sidebar.js"></script><script src="js/commercial-overview.js"></script></body></html>
